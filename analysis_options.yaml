# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Exclude generated files
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    # Exclude build directories
    - "build/**"
    - ".dart_tool/**"
    # Exclude archived (unmaintained) code
    - "**/_archive/**"

  language:
    strict-casts: false      # Too noisy — 400+ false positives from Firestore dynamic data
    strict-inference: false   # ~460 inference failures — not practical with Firestore
    strict-raw-types: false

linter:
  rules:
    # ── Enabled safety rules ──────────────────────────────────────────
    avoid_print: true
    use_build_context_synchronously: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_empty_else: true

    # ── Style and readability ─────────────────────────────────────────
    avoid_unnecessary_containers: true
    prefer_interpolation_to_compose_strings: true
    prefer_typing_uninitialized_variables: true
    sort_child_properties_last: true
    sized_box_for_whitespace: true
    unnecessary_brace_in_string_interps: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    unnecessary_new: true
    unnecessary_this: true

    # ── Relaxed rules (too costly to fix across 650+ files) ───────────
    file_names: false
    library_private_types_in_public_api: false
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    prefer_single_quotes: false
    avoid_slow_async_io: false
    overridden_fields: false
    constant_identifier_names: false
