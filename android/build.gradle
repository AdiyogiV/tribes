buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath('com.android.tools.build:gradle:8.9.1')

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }

    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        options.compilerArgs.removeAll { it == '-Werror' }
        options.compilerArgs << "-Xlint:-options"
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            jvmTarget = '17'
            freeCompilerArgs = freeCompilerArgs - "-Werror"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { sub ->
    if (sub.name == 'app') return
    sub.afterEvaluate {
        if (sub.hasProperty('android')) {
            sub.android.ndkVersion = "28.2.13676358"
            if (sub.android.compileSdk == null || sub.android.compileSdk < 36) {
                sub.android.compileSdk = 36
            }
            sub.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            if (sub.android.namespace == null || sub.android.namespace.isEmpty()) {
                def manifest = sub.file("src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def pkg = new XmlParser().parse(manifest).attribute("package")
                    if (pkg != null) {
                        sub.android.namespace = pkg
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
