name: Deploy backend → dev

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Functions to deploy (comma-separated) or "all"'
        required: false
        default: 'all'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Smart deploy to aurogram-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Detect changed functions
        id: changes
        working-directory: backend
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            if [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
              echo "deploy_all=true" >> $GITHUB_OUTPUT
              echo "functions=" >> $GITHUB_OUTPUT
            else
              echo "deploy_all=false" >> $GITHUB_OUTPUT
              echo "functions=$TARGET" >> $GITHUB_OUTPUT
            fi
          else
            node scripts/detect-changes.js
          fi

      - name: Authenticate to Google Cloud (dev)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy ALL functions to dev
        if: steps.changes.outputs.deploy_all == 'true'
        working-directory: backend
        run: |
          echo "Shared dependency changed — deploying all functions to dev"
          firebase deploy --only functions --project aurogram-dev --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy changed functions to dev
        if: steps.changes.outputs.deploy_all == 'false' && steps.changes.outputs.functions != ''
        working-directory: backend
        run: |
          FUNCTIONS="${{ steps.changes.outputs.functions }}"
          ONLY=$(echo "$FUNCTIONS" | tr ',' '\n' | sed 's/^/functions:/' | tr '\n' ',' | sed 's/,$//')
          echo "Deploying to aurogram-dev: $ONLY"
          firebase deploy --only "$ONLY" --project aurogram-dev --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: No functions to deploy
        if: steps.changes.outputs.deploy_all == 'false' && steps.changes.outputs.functions == ''
        run: echo "No Cloud Function files changed — skipping function deploy"

      - name: Deploy Firestore rules to dev
        if: contains(toJSON(github.event.commits), 'backend/firestore.rules')
        working-directory: backend
        run: firebase deploy --only firestore:rules --project aurogram-dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        if: always()
        run: |
          echo "### Deploy backend → dev" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** aurogram-dev" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy all:** ${{ steps.changes.outputs.deploy_all }}" >> $GITHUB_STEP_SUMMARY
          echo "**Functions:** \`${{ steps.changes.outputs.functions }}\`" >> $GITHUB_STEP_SUMMARY
