name: Deploy backend → prod

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'   # only fires when backend code changes

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel an in-flight prod deploy

jobs:
  deploy:
    name: Smart deploy to prod (ty-dev-516d7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production   # requires manual approval in GitHub (configure in repo settings)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Detect changed functions
        id: changes
        working-directory: backend
        run: node scripts/detect-changes.js

      - name: Authenticate to Google Cloud (prod)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy ALL functions to prod
        if: steps.changes.outputs.deploy_all == 'true'
        working-directory: backend
        run: |
          echo "⚠️  Shared dependency changed — deploying all functions to prod"
          firebase deploy --only functions --project prod --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy changed functions to prod
        if: steps.changes.outputs.deploy_all == 'false' && steps.changes.outputs.functions != ''
        working-directory: backend
        run: |
          FUNCTIONS="${{ steps.changes.outputs.functions }}"
          ONLY=$(echo "$FUNCTIONS" | tr ',' '\n' | sed 's/^/functions:/' | tr '\n' ',' | sed 's/,$//')
          echo "Deploying to PROD: $ONLY"
          firebase deploy --only "$ONLY" --project prod --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: No functions to deploy
        if: steps.changes.outputs.deploy_all == 'false' && steps.changes.outputs.functions == ''
        run: echo "No Cloud Function files changed — skipping function deploy"

      - name: Deploy Firestore rules to prod
        if: contains(github.event.commits[0].modified, 'backend/firestore.rules') || contains(github.event.commits[0].added, 'backend/firestore.rules')
        working-directory: backend
        run: firebase deploy --only firestore:rules --project prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        run: |
          echo "### ✅ Prod deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ty-dev-516d7 (Aurogram prod)" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy all:** ${{ steps.changes.outputs.deploy_all }}" >> $GITHUB_STEP_SUMMARY
          echo "**Functions:** ${{ steps.changes.outputs.functions }}" >> $GITHUB_STEP_SUMMARY
