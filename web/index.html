<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Primary Meta Tags -->
  <title>Aurogram - Connect with Your Tribe</title>
  <meta name="title" content="Aurogram - Connect with Your Tribe">
  <meta name="description"
    content="Connect with your tribe through video, chat, and AI-powered insights. Share moments, join group calls, and explore your cosmic journey.">
  <meta name="keywords" content="social app, video chat, group calls, astrology, AI chat, community, tribes">
  <meta name="author" content="Aurogram">
  <meta name="robots" content="index, follow">

  <!-- Theme Color -->
  <meta name="theme-color" content="#5A3D34">
  <meta name="msapplication-TileColor" content="#080C14">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://aurogram.in/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aurogram.in/">
  <meta property="og:title" content="Aurogram - Connect with Your Tribe">
  <meta property="og:description"
    content="Connect with your tribe through video, chat, and AI-powered insights. Share moments, join group calls, and explore your cosmic journey.">
  <meta property="og:image" content="https://aurogram.in/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Aurogram">
  <meta property="og:locale" content="en_US">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://aurogram.in/">
  <meta name="twitter:title" content="Aurogram - Connect with Your Tribe">
  <meta name="twitter:description"
    content="Connect with your tribe through video, chat, and AI-powered insights. Share moments, join group calls, and explore your cosmic journey.">
  <meta name="twitter:image" content="https://aurogram.in/icons/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aurogram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Splash screens for iOS -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!--
    PERFORMANCE: Preload the heaviest resources so the browser starts
    downloading them immediately — before flutter_bootstrap.js even parses.
    main.dart.js (8 MB) is the #1 bottleneck; starting it early is the
    single biggest speed win.
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- Preconnect to Firebase (used by app at runtime) -->
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">

  <!-- Preconnect to CanvasKit CDN (loaded during engine init) -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- Agora SDK: lazy-loaded on demand, no need to preconnect -->

  <script>
    // Agora SDK lazy loader — only fetches when user enters a call
    var agoraLoaded = false, agoraLoadCallbacks = [], agoraLoadAttempted = false;
    window.loadAgoraSDK = function (cb) {
      if (agoraLoaded) { if (cb) cb(); return; }
      if (cb) agoraLoadCallbacks.push(cb);
      if (agoraLoadAttempted) return;
      agoraLoadAttempted = true;
      var s = document.createElement('script');
      s.src = 'https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js';
      s.onload = function () {
        agoraLoaded = true;
        agoraLoadCallbacks.forEach(function (fn) { try { fn(); } catch (e) { } });
        agoraLoadCallbacks = [];
      };
      s.onerror = function () { agoraLoadAttempted = false; };
      document.head.appendChild(s);
    };
    window.isAgoraLoaded = function () { return agoraLoaded; };
  </script>

  <!--
    flutter_bootstrap.js = Flutter loader + _flutter.buildConfig + auto-start.
    Our build script patches it to remove service worker registration and add
    the loading-screen callback.  `defer` ensures it runs after HTML parse
    but does NOT wait for images/fonts like window.load would.
  -->
  <script src="flutter_bootstrap.js" defer></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080C14;
      overflow: hidden;
    }

    .flutter-loader,
    flt-glass-pane,
    flt-scene-host {
      background-color: #080C14 !important;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #080C14;
      z-index: 9999;
    }

    .loading-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
      border-radius: 20px;
    }

    .loading-text {
      color: #8D6E63;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: lowercase;
      font-weight: 600;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.85;
      }
    }

    .flutter-loaded .loading-container {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }

    video[id^="video_RTCVideoRenderer"] {
      object-fit: contain !important;
    }
  </style>
</head>

<body>
  <div class="loading-container" id="loading">
    <img src="icons/icon_transparent.png" alt="Aurogram" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-text">aurogram</div>
  </div>

  <script>
    // Register Firebase Messaging SW (push notifications + PWA caching).
    // Runs async — does not block Flutter startup.
    if ('serviceWorker' in navigator) {
      // Track whether this is the FIRST service worker controlling this page.
      // We only reload when an UPDATE replaces an existing SW, never on first load.
      var isFirstSW = !navigator.serviceWorker.controller;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        // Skip reload on very first SW registration (no previous controller).
        if (isFirstSW) {
          isFirstSW = false;
          return;
        }
        // Only reload once per page lifetime — no loops possible.
        // This flag lives in memory; a reload creates a fresh page with no flag.
        // But the NEW SW is already active, so controllerchange won't fire again.
        console.log('[SW] New service worker activated — reloading for fresh content');
        window.location.reload();
      });

      navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        updateViaCache: 'none'
      }).then(function (reg) {
        // Check for SW updates on every page load (browser default is every 24h).
        reg.update();
      });
    }
  </script>
</body>

</html>
