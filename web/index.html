  <!--
    PERFORMANCE: Preload the heaviest resources so the browser starts
    downloading them immediately — before flutter_bootstrap.js even parses.
    main.dart.js (8 MB) is the #1 bottleneck; starting it early is the
    single biggest speed win.

  <!-- Agora SDK: lazy-loaded on demand, no need to preconnect -->

  <script>
    // ── Firestore Web SDK crash guard (ca9 / b815) ────────────────────────
    // The firebase-js-sdk Firestore client has a fatal bug (firebase-js-sdk
    // #9267 / #9968 / #10008): a stray watch-target ack drives
    // `pendingResponses` below zero → hardAssert throws
    //   "INTERNAL ASSERTION FAILED: Unexpected state (ID: ca9)"
    // that throw poisons Firestore's AsyncQueue, which then PERMANENTLY fails,
    // so every later read/listen/write throws "(ID: b815)" — hundreds of
    // repeats — while the PWA shell still renders from cache (looks "loaded"
    // but Firestore is dead → blank/stale app, calls + data all fail).
    //
    // The client is unrecoverable in place (even terminate() enqueues on the
    // dead queue). These are raw JS throws in a microtask, so Dart's
    // runZonedGuarded / FlutterError.onError never see them. The only fix is a
    // fresh client → a page reload. We cap reloads per session so a persistent
    // boot-time crash can never become an infinite reload loop.
    (function () {
      var KEY = 'aurogram_fs_assert_reloads';
      var MAX_RELOADS = 2;
      var handled = false;

      function isFatalAssertion(msg) {
        return typeof msg === 'string'
          && msg.indexOf('INTERNAL ASSERTION FAILED') !== -1
          && (msg.indexOf('ca9') !== -1 || msg.indexOf('b815') !== -1);
      }

      function stringify(v) {
        if (!v) return '';
        if (typeof v === 'string') return v;
        return String(v.stack || v.message || v);
      }

      function recover(msg) {
        if (handled) return;
        handled = true;
        var count = 0;
        try { count = parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
        console.warn('[fs-guard] Firestore ca9/b815 assertion — client bricked; reloadCount=' + count);
        if (count >= MAX_RELOADS) {
          console.warn('[fs-guard] reload cap reached — not reloading (avoiding loop)');
          return;
        }
        try { sessionStorage.setItem(KEY, String(count + 1)); } catch (e) {}
        // Let the current microtask unwind before swapping in a fresh client.
        setTimeout(function () { try { location.reload(); } catch (e) {} }, 150);
      }

      window.addEventListener('unhandledrejection', function (ev) {
        var msg = stringify(ev && ev.reason);
        if (isFatalAssertion(msg)) {
          try { ev.preventDefault(); } catch (e) {} // silence the console spam
          recover(msg);
        }
      });

      window.addEventListener('error', function (ev) {
        var msg = stringify(ev && ev.error) + ' ' + ((ev && ev.message) || '');
        if (isFatalAssertion(msg)) recover(msg);
      });

      // Survived a clearly-healthy window with no assertion → reset the reload
      // budget so each independent future incident gets its own retries while a
      // boot loop stays capped.
      setTimeout(function () {
        if (!handled) { try { sessionStorage.removeItem(KEY); } catch (e) {} }
      }, 20000);
    })();
  </script>

  <script>
    // Agora SDK lazy loader — only fetches when user enters a call
    var agoraLoaded = false, agoraLoadCallbacks = [], agoraLoadAttempted = false;
    window.loadAgoraSDK = function (cb) {
      if (agoraLoaded) { if (cb) cb(); return; }
      if (cb) agoraLoadCallbacks.push(cb);
      if (agoraLoadAttempted) return;
      agoraLoadAttempted = true;
      var s = document.createElement('script');
      s.src = 'https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js';
      s.onload = function () {
        agoraLoaded = true;
        agoraLoadCallbacks.forEach(function (fn) { try { fn(); } catch (e) { } });
        agoraLoadCallbacks = [];
      };
      s.onerror = function () { agoraLoadAttempted = false; };
      document.head.appendChild(s);
    };
    window.isAgoraLoaded = function () { return agoraLoaded; };
  </script>

  <!--
    flutter_bootstrap.js = Flutter loader + _flutter.buildConfig + auto-start.
    Our build script patches it to remove service worker registration and add
    the loading-screen callback.  `defer` ensures it runs after HTML parse
    but does NOT wait for images/fonts like window.load would.
  -->
  <script src="flutter_bootstrap.js" defer></script>

  <style>

<body>
  <div class="loading-container" id="loading">

    <div class="loading-text">aurogram</div>
  </div>

  <script>
    // ── Splash dismissal fallback ─────────────────────────────────────────
    // In RELEASE, build-web.sh patches flutter_bootstrap.js to add the
    // `flutter-loaded` class (via onEntrypointLoaded) which fades the splash.
    // But `flutter run -d chrome` (dev) regenerates an UN-patched bootstrap,
    // so that class is never added and the splash sits on top of a fully
    // rendered app forever ("stuck on flash screen").
    //
    // This fallback lifts the curtain the moment Flutter actually paints its
    // view element — works in dev AND is a harmless no-op in release, since
    // classList.add is idempotent. Belt-and-suspenders, no behavior dup.
    (function () {
      function isFlutterView(node) {
        if (!node || node.nodeType !== 1) return false;
        var tag = node.tagName;
        return tag === 'FLUTTER-VIEW' || tag === 'FLT-GLASS-PANE'
          || (node.getElementsByTagName
              && node.getElementsByTagName('flt-glass-pane').length > 0);
      }

      function reveal() {
        document.body.classList.add('flutter-loaded');
      }

      // If it's somehow already there, reveal immediately.
      if (document.getElementsByTagName('flt-glass-pane').length > 0
          || document.getElementsByTagName('flutter-view').length > 0) {
        reveal();
        return;
      }

      var observer = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            if (isFlutterView(added[j])) {
              reveal();
              observer.disconnect();
              return;
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Hard safety net: never trap the user behind the splash indefinitely.
      setTimeout(function () { reveal(); observer.disconnect(); }, 8000);
    })();
  </script>

  <script>
    // Register Firebase Messaging SW (push notifications + PWA caching).
    // Runs async — does not block Flutter startup.
    if ('serviceWorker' in navigator) {
      // Track whether this is the FIRST service worker controlling this page.
      // We only reload when an UPDATE replaces an existing SW, never on first load.
      var isFirstSW = !navigator.serviceWorker.controller;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        // Skip reload on very first SW registration (no previous controller).
        if (isFirstSW) {
          isFirstSW = false;
          return;
        }
        // Only reload once per page lifetime — no loops possible.
        // This flag lives in memory; a reload creates a fresh page with no flag.
        // But the NEW SW is already active, so controllerchange won't fire again.
        console.log('[SW] New service worker activated — reloading for fresh content');
        window.location.reload();
      });

      navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        updateViaCache: 'none'
      }).then(function (reg) {
        // Check for SW updates on every page load (browser default is every 24h).
        reg.update();
      });
    }
  </script>
