<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Aurogram</title>
  <meta name="theme-color" content="#5A3D34">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #080C14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8D6E63;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 16px;
      opacity: 0.8;
    }
    
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #d4a574;
    }
    
    .message {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
      opacity: 0.8;
    }
    
    .retry-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #5A3D34;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    
    .retry-btn:hover {
      background: #6d4a3f;
    }
    
    .offline-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">📡</div>
    <img src="icons/icon_transparent.png" alt="Aurogram" class="logo" onerror="this.style.display='none'">
    <h1 class="title">You're Offline</h1>
    <p class="message">
      It looks like you've lost your internet connection. 
      Please check your network and try again.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
  </div>
  
  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
