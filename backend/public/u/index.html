<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Profile on Aurogram</title>
    <meta name="description" content="View this cosmic profile on Aurogram - Vedic astrology and cosmic connections.">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="View Profile on Aurogram">
    <meta property="og:description" content="Check out this cosmic profile and see your compatibility!">
    <meta property="og:image" content="/og-profile.png">
    
    <!-- iOS Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_STORE_ID">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d241c 50%, #1a1410 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4a574;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
        }
        
        .cosmic-card {
            background: rgba(212, 165, 116, 0.08);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 24px;
            padding: 32px 24px;
            margin-bottom: 24px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #d4a574 0%, #a67c52 100%);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .profile-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .profile-subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 24px;
        }
        
        .signs-preview {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        .sign-item {
            text-align: center;
        }
        
        .sign-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .sign-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        
        .cta-section {
            margin-bottom: 24px;
        }
        
        .cta-text {
            font-size: 15px;
            margin-bottom: 16px;
            opacity: 0.85;
        }
        
        .btn {
            display: block;
            padding: 16px 24px;
            background: #d4a574;
            color: #1a1410;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        
        .btn:hover {
            background: #e5b885;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: transparent;
            color: #d4a574;
            border: 2px solid rgba(212, 165, 116, 0.4);
        }
        
        .btn.secondary:hover {
            border-color: #d4a574;
            background: rgba(212, 165, 116, 0.1);
        }
        
        .store-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .store-link {
            font-size: 13px;
            color: #d4a574;
            opacity: 0.7;
            text-decoration: none;
        }
        
        .store-link:hover {
            opacity: 1;
        }
        
        .branding {
            margin-top: 32px;
            font-size: 12px;
            opacity: 0.5;
        }
        
        .branding a {
            color: #d4a574;
            text-decoration: none;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: block;
            margin: 20px 0;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cosmic-card">
            <div class="avatar">✨</div>
            <h1 class="profile-title">Cosmic Profile</h1>
            <p class="profile-subtitle">Someone shared their cosmic profile with you</p>
            
            <div class="signs-preview">
                <div class="sign-item">
                    <div class="sign-icon">☉</div>
                    <div class="sign-label">Sun</div>
                </div>
                <div class="sign-item">
                    <div class="sign-icon">☽</div>
                    <div class="sign-label">Moon</div>
                </div>
                <div class="sign-item">
                    <div class="sign-icon">↑</div>
                    <div class="sign-label">Rising</div>
                </div>
            </div>
        </div>
        
        <div class="cta-section">
            <p class="cta-text">Open in Aurogram to view their cosmic profile and check your compatibility!</p>
            
            <a href="#" class="btn" id="open-app-btn" onclick="openApp()">
                Open in App
            </a>
            
            <p class="loading" id="loading-msg">Opening app...</p>
            
            <a href="#" class="btn secondary" id="download-btn">
                Download Aurogram
            </a>
        </div>
        
        <div class="store-links">
            <a href="https://apps.apple.com/app/id6474496853" class="store-link">iOS App Store</a>
            <span style="opacity: 0.3">•</span>
            <a href="https://play.google.com/store/apps/details?id=com.canay.dhaara" class="store-link">Google Play</a>
        </div>
        
        <div class="branding">
            <a href="/">✨ Aurogram</a> - Cosmic Connections
        </div>
    </div>
    
    <script>
        // Get user ID from URL path
        const pathParts = window.location.pathname.split('/');
        const userId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        
        // Detect platform
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        
        // Set download button link
        const downloadBtn = document.getElementById('download-btn');
        if (isIOS) {
            downloadBtn.href = 'https://apps.apple.com/app/id6474496853';
            downloadBtn.textContent = 'Download on iOS';
        } else if (isAndroid) {
            downloadBtn.href = 'https://play.google.com/store/apps/details?id=com.canay.dhaara';
            downloadBtn.textContent = 'Get it on Android';
        } else {
            downloadBtn.href = 'https://apps.apple.com/app/id6474496853';
            downloadBtn.textContent = 'Download Aurogram';
        }
        
        // Try to open app
        function openApp() {
            const loadingMsg = document.getElementById('loading-msg');
            loadingMsg.classList.add('show');
            
            // Universal link - will open app if installed (iOS/Android)
            const appUrl = window.location.href;
            
            // For fallback, use custom scheme
            const customSchemeUrl = `aurogram://u/${userId}`;
            
            // Try universal link first (same URL), then fall back to store
            let appOpened = false;
            
            // Set timeout to redirect to store if app doesn't open
            const timeout = setTimeout(() => {
                if (!appOpened) {
                    loadingMsg.textContent = 'App not installed. Redirecting to store...';
                    setTimeout(() => {
                        window.location.href = downloadBtn.href;
                    }, 1000);
                }
            }, 2500);
            
            // Listen for page visibility change (app opened successfully)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    appOpened = true;
                    clearTimeout(timeout);
                }
            });
            
            // Try custom scheme for existing app users
            if (isIOS || isAndroid) {
                window.location.href = customSchemeUrl;
            }
        }
        
        // Auto-attempt to open app on mobile (after small delay for UX)
        if ((isIOS || isAndroid) && userId) {
            // Don't auto-open, let user click - better UX
        }
    </script>
</body>
</html>
