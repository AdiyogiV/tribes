<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Cosmic Connection | Aurogram</title>
    <meta name="description" content="Someone wants to know your cosmic compatibility! Check your connection on Aurogram.">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Check Your Cosmic Connection ✨">
    <meta property="og:description" content="Someone wants to see your cosmic compatibility! Discover what the stars say about your connection.">
    <meta property="og:image" content="/og-cosmic.png">
    
    <!-- iOS Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_STORE_ID">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d241c 50%, #1a1410 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4a574;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
        }
        
        .cosmic-card {
            background: rgba(212, 165, 116, 0.08);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 24px;
            padding: 32px 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        
        .cosmic-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.1) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .cosmic-icon {
            font-size: 64px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        
        .cosmic-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        
        .cosmic-subtitle {
            font-size: 15px;
            opacity: 0.8;
            margin-bottom: 24px;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }
        
        .mystery-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .mystery-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 8px;
        }
        
        .mystery-value {
            font-size: 32px;
            font-weight: 700;
            color: #d4a574;
        }
        
        .mystery-hint {
            font-size: 13px;
            opacity: 0.6;
            margin-top: 8px;
        }
        
        .cta-section {
            margin-bottom: 24px;
        }
        
        .btn {
            display: block;
            padding: 18px 24px;
            background: #d4a574;
            color: #1a1410;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        
        .btn:hover {
            background: #e5b885;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: transparent;
            color: #d4a574;
            border: 2px solid rgba(212, 165, 116, 0.4);
            font-weight: 600;
            font-size: 15px;
        }
        
        .btn.secondary:hover {
            border-color: #d4a574;
            background: rgba(212, 165, 116, 0.1);
        }
        
        .store-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .store-link {
            font-size: 13px;
            color: #d4a574;
            opacity: 0.7;
            text-decoration: none;
        }
        
        .store-link:hover {
            opacity: 1;
        }
        
        .branding {
            margin-top: 32px;
            font-size: 12px;
            opacity: 0.5;
        }
        
        .branding a {
            color: #d4a574;
            text-decoration: none;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: block;
            margin: 16px 0;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cosmic-card">
            <div class="cosmic-icon">🔮</div>
            <h1 class="cosmic-title">Cosmic Connection</h1>
            <p class="cosmic-subtitle">Someone wants to check your cosmic compatibility!</p>
            
            <div class="mystery-box">
                <div class="mystery-label">Your Compatibility</div>
                <div class="mystery-value">? ? %</div>
                <div class="mystery-hint">Open in app to reveal</div>
            </div>
        </div>
        
        <div class="cta-section">
            <a href="#" class="btn" id="open-app-btn" onclick="openApp()">
                ✨ Reveal Your Connection
            </a>
            
            <p class="loading" id="loading-msg">Opening Aurogram...</p>
            
            <a href="#" class="btn secondary" id="download-btn">
                Download Aurogram
            </a>
        </div>
        
        <div class="store-links">
            <a href="https://apps.apple.com/app/id6474496853" class="store-link">iOS App Store</a>
            <span style="opacity: 0.3">•</span>
            <a href="https://play.google.com/store/apps/details?id=com.canay.dhaara" class="store-link">Google Play</a>
        </div>
        
        <div class="branding">
            <a href="/">✨ Aurogram</a> - Discover Your Cosmic Connections
        </div>
    </div>
    
    <script>
        // Get user ID from URL path
        const pathParts = window.location.pathname.split('/');
        const userId = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        
        // Detect platform
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        
        // Set download button link
        const downloadBtn = document.getElementById('download-btn');
        if (isIOS) {
            downloadBtn.href = 'https://apps.apple.com/app/id6474496853';
            downloadBtn.textContent = 'Download on iOS';
        } else if (isAndroid) {
            downloadBtn.href = 'https://play.google.com/store/apps/details?id=com.canay.dhaara';
            downloadBtn.textContent = 'Get it on Android';
        } else {
            downloadBtn.href = 'https://apps.apple.com/app/id6474496853';
            downloadBtn.textContent = 'Download Aurogram';
        }
        
        // Try to open app
        function openApp() {
            const loadingMsg = document.getElementById('loading-msg');
            loadingMsg.classList.add('show');
            
            // Custom scheme for existing app users
            const customSchemeUrl = `aurogram://cosmic/${userId}`;
            
            let appOpened = false;
            
            // Set timeout to redirect to store if app doesn't open
            const timeout = setTimeout(() => {
                if (!appOpened) {
                    loadingMsg.textContent = 'App not installed. Redirecting to store...';
                    setTimeout(() => {
                        window.location.href = downloadBtn.href;
                    }, 1000);
                }
            }, 2500);
            
            // Listen for page visibility change (app opened successfully)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    appOpened = true;
                    clearTimeout(timeout);
                }
            });
            
            // Try custom scheme
            if (isIOS || isAndroid) {
                window.location.href = customSchemeUrl;
            }
        }
    </script>
</body>
</html>
